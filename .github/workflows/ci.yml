name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Run the full Linux/macOS OTP compatibility suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Linux / OTP 29 smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Build optional SQLite adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          make sqlite
      - name: Compiler and dev tool tests
        run: go test ./internal/... ./cmd/bench -count=1 -timeout=10m
      - name: CLI, OTP, and packaging smoke tests
        run: go test ./cmd/linglang -run '^(TestExecutionWithGCFlags|TestSupervisorEscalationExitsCleanly|TestDirectoryCLI|TestReadSources|TestPackCLI|TestDeveloperCommands|TestStructuredRunnerCLI|TestStructuredToolingCLI|TestCheckTestDiscovery|TestToolingOutputFailure|TestInitProject|TestInitRejectsExistingContent|TestBookExamples|TestLocalModules|TestDependencyLock|TestWebCounter|TestIsolatedOTPLaunchers|TestBootstrapEmitterPackedWithoutGo)$' -count=1 -timeout=5m
      - name: Self-hosted driver feature checks
        run: go test ./cmd/linglang -run 'TestBootstrapCLI/.*/(test_runner|modules|typed_io|structured_tooling|developer_tools|discovery)' -count=1 -timeout=8m
      - name: Go-free build orchestration checks
        run: go test ./cmd/linglang -run 'TestGoFreeBootstrapTool|TestBootstrapSchedulerDefaults' -count=1 -timeout=2m
      - name: Build the CLI
        run: go build -o _build/linglang ./cmd/linglang
      - name: Check example formatting
        run: ./_build/linglang fmt --check examples/worker_tests bootstrap/lexer bootstrap/parser bootstrap/resolver bootstrap/checker bootstrap/emitter examples/bootstrap_demo examples/bootstrap_loops.lang
      - name: Test workers on both backends with GC stress
        run: |
          ./_build/linglang test --gc-stress --gc-stats examples/worker_tests
          ./_build/linglang test --no-opt --gc-stress --gc-stats examples/worker_tests
          ./_build/linglang test --gc-stress tests/concurrency
          ./_build/linglang test --no-opt --gc-stress tests/concurrency

  compatibility:
    name: ${{ matrix.os }} / OTP ${{ matrix.otp }}
    if: github.event_name == 'workflow_dispatch' && inputs.full_compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Install SQLite development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - name: Compiler, runtime, CLI, packaging, and release tests
        # The baseline frontend self-check plus per-fixture BEAM launches can
        # exceed ten minutes on hosted runners. Individual VMs remain bounded.
        run: go test ./... -count=1 -timeout=30m
      - name: Build the CLI
        run: go build -o _build/linglang ./cmd/linglang
      - name: Check example formatting
        run: ./_build/linglang fmt --check examples/worker_tests bootstrap/lexer bootstrap/parser bootstrap/resolver bootstrap/checker bootstrap/emitter examples/bootstrap_demo examples/bootstrap_loops.lang
      - name: Test workers and the bootstrap tools on both backends with GC stress
        run: |
          ./_build/linglang test --gc-stress --gc-stats examples/worker_tests
          ./_build/linglang test --no-opt --gc-stress --gc-stats examples/worker_tests
          ./_build/linglang test --gc-stress tests/concurrency
          ./_build/linglang test --no-opt --gc-stress tests/concurrency
          ./_build/linglang test --gc-stress --gc-stats bootstrap/lexer
          ./_build/linglang test --no-opt --gc-stress --gc-stats bootstrap/lexer
          ./_build/linglang test --gc-stress --gc-stats bootstrap/parser
          ./_build/linglang test --no-opt --gc-stress --gc-stats bootstrap/parser
          ./_build/linglang test --gc-stress --gc-stats bootstrap/resolver
          ./_build/linglang test --no-opt --gc-stress --gc-stats bootstrap/resolver
          ./_build/linglang test --gc-stress --gc-stats --timeout 5m bootstrap/checker
          ./_build/linglang test --no-opt --gc-stress --gc-stats --timeout 5m bootstrap/checker
          ./_build/linglang test --gc-stress --gc-stats --timeout 2m bootstrap/emitter
          ./_build/linglang test --no-opt --gc-stress --gc-stats --timeout 2m bootstrap/emitter
      - name: Fuzz the compiler
        if: matrix.os == 'ubuntu-24.04' && matrix.otp == '29'
        run: go test ./internal/compiler -run='^$' -fuzz='^FuzzCompile$' -fuzztime=10s -parallel=2

  editor:
    name: VS Code grammar and Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run package -- linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: linglang-vscode-linux-x64
          path: dist/linglang-vscode-linux-x64.vsix
          if-no-files-found: error

  book:
    name: Build language book
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked
      - name: Build chapters and resolve source includes
        run: mdbook build book
      - uses: actions/upload-artifact@v7
        with:
          name: linglang-book
          path: _build/book/
          if-no-files-found: error
